<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pixel Gun OG</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link id="css" rel="stylesheet" href="css/style.css?v=18">
</head>
<body>
<div id="hud">
  <div id="hit"></div><div id="scope"></div><div id="cross"></div>
  <div id="top"></div><div id="bossbar"><div id="bossfill"></div><span>BOSS</span></div><div id="banner"></div>
  <div id="board" class="lb"></div><div id="feed"></div>
  <div id="chat"><div id="chatLog"></div><input id="chatIn" maxlength="80" autocomplete="off" spellcheck="false"></div>
  <div id="toast"></div><div id="arm"></div><div id="hp"></div><div id="ammo"></div><div id="hotbar"></div>
</div>
<div id="lobby">
  <div id="lobbyPanel">
    <div id="prof"></div>
    <div id="nameRow"><input id="nameIn" maxlength="16" autocomplete="off" spellcheck="false"><button id="nameDice" title="Random name">🎲</button></div>
    <p id="lobbyBest"></p>
    <div class="label">SELECT MODE</div>
    <div id="modes">
      <button class="mode sel" data-mode="zombies"><b>ZOMBIE WAVES</b><small>Survive the waves, earn coins, beat the boss every 5 waves</small></button>
      <button class="mode" data-mode="dm"><b>DEATHMATCH</b><small>4 minute free-for-all. Highest score wins</small></button>
      <button class="mode" disabled><b>MORE MODES</b><small>Coming soon</small></button>
    </div>
    <div class="label">SELECT MAP</div>
    <div id="maps">
      <button class="map" data-map="yard"><b>THE YARD</b><small>Small · 4 players</small></button>
      <button class="map" data-map="forest"><b>THE FOREST</b><small>Medium · 8 players</small></button>
    </div>
    <button id="playBtn">▶ PLAY</button>
    <button id="lobbyCtrl">CONTROLS</button>
  </div>
  <div id="stage"></div>
</div>
<div id="menu">
  <p id="msg">Paused</p>
  <p id="best" style="color:#ffd23f"></p>
  <p id="help"></p>
  <p id="tip1"></p>
  <p id="tip2"></p>
  <p id="go" style="color:#ffd23f;margin-top:20px">[ CLICK TO RESUME ]</p>
  <div><button id="ctrlBtn">CONTROLS</button> <button id="lobbyBtn">EXIT GAME</button></div>
</div>
<div id="binds">
  <button id="bindX">✕ CLOSE</button>
  <h1>CONTROLS</h1>
  <small>Click a box, then press a key, mouse button or scroll. Backspace clears it, Esc cancels.</small>
  <div id="bindList"></div>
  <div><button id="bindReset">RESET DEFAULTS</button> <button id="bindDone">DONE</button></div>
</div>
<div id="post">
  <p id="postSub">MATCH OVER</p>
  <h1 id="postPlace"></h1>
  <div id="postBoard" class="lb"></div>
  <div id="rewards"></div>
  <div><button id="againBtn">PLAY AGAIN</button> <button id="postLobby">EXIT TO LOBBY</button></div>
</div>
<div id="shop">
  <h1>SHOP</h1>
  <p id="shopInfo"></p>
  <div id="items"></div>
  <button id="next">NEXT WAVE ▶</button>
</div>
<script type="module">
// Three.js only ships as a module, so load it here, make it global,
// then load the game files in order as plain scripts (works from file://).
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
window.THREE = THREE;
// Bump V (and the ?v= on the stylesheet above) on every update so browsers
// grab the new files instead of mixing in old cached ones.
const V = 18;
const FILES = ['js/core.js', 'js/profile.js', 'js/names.js', 'js/maps/world.js', 'js/maps/yard.js', 'js/maps/forest.js','js/player.js', 'js/weapons.js',
  'js/modes/zombies.js', 'js/combat.js', 'js/modes/deathmatch.js', 'js/chat.js', 'js/lobby.js', 'js/input.js', 'js/main.js'];
for (const src of FILES) {
  const s = document.createElement('script');
  s.src = src + '?v=' + V; s.async = false; // async=false keeps them running in list order
  document.body.append(s);
}
</script>
</body></html>
